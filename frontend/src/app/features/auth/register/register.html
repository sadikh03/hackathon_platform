<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Créer un compte</h1>
    <p class="auth-subtitle">Rejoignez la plateforme du hackathon</p>

    <form (ngSubmit)="onSubmit()" class="auth-form">

      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="formData.username"
          name="username"
          required
          placeholder="Votre username" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="formData.email"
          name="email"
          required
          placeholder="vous@exemple.com" />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="formData.password"
          name="password"
          required
          placeholder="Minimum 6 caractères" />
      </div>

      <div class="form-group">
        <label for="role">Vous êtes</label>
        <select id="role" [(ngModel)]="formData.role" name="role" required>
          @for (r of roles; track r) {
            <option [value]="r">{{ r.replace('ROLE_', '') }}</option>
          }
        </select>
      </div>

      @if (errorMessage()) {
        <div class="error-banner">{{ errorMessage() }}</div>
      }

      @if (successMessage()) {
        <div class="success-banner">{{ successMessage() }}</div>
      }

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        {{ isLoading() ? 'Création...' : 'Créer mon compte' }}
      </button>

    </form>

    <p class="auth-footer">
      Déjà un compte ? <a routerLink="/login">Se connecter</a>
    </p>
  </div>
</div>
